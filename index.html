<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日記 - ホーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4eee5;
}

body {
  position: fixed;
  inset: 0;
  font-family: 'Zen Maru Gothic', sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  background: #f4eee5;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* メインSVGは縦横比を固定し、画面に合わせて縮小する */
#main-area {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#art-frame {
  position: relative;
  flex: none;
  height: 100%;
  width: auto;
  max-width: 100%;
  aspect-ratio: 584.46 / 1172.11;
  overflow: visible;
}

#art {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* ヘッダーはメインSVGと同じ縮尺で重ねる */
#header-slot {
  position: absolute;
  z-index: 5;
  top: 0;
  left: 6.8%;
  width: 8.78%;
  pointer-events: none;
}
#header-slot svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

#footer-slot {
  flex: 0 0 auto;
  width: min(100%, 585.96px);
  max-height: 11dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}
#footer-slot svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 11dvh;
  overflow: visible;
}

svg [role="button"] { cursor: pointer; }
.hit-area { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="stage">
  <div id="main-area">
    <div id="art-frame">
      <div id="header-slot"></div>
      <div id="main-slot"></div>
    </div>
  </div>
  <div id="footer-slot"></div>
</div>

<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const ASSET = "assets/";
  const PAGES = {
    home: "index.html",
    menu: "menu.html",
    record: "emotion.html",
    search: "kensaku.html",
    mypage: "mypage.html",
    calendar: "calendar.html"
  };

  let svg = null;
  let headerSvg = null;
  let footerSvg = null;

  async function loadSvg(path, targetId) {
    const response = await fetch(path);
    if (!response.ok) throw new Error(`${path} を読み込めませんでした (${response.status})`);
    const source = await response.text();
    const doc = new DOMParser().parseFromString(source, "image/svg+xml");
    const root = doc.documentElement;
    if (root.nodeName.toLowerCase() !== "svg" || doc.querySelector("parsererror")) {
      throw new Error(`${path} のSVG形式を読み取れませんでした`);
    }
    const imported = document.importNode(root, true);
    document.getElementById(targetId).replaceChildren(imported);
    return imported;
  }

  function localDateString(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function displayDate(date) {
    return date.replaceAll("-", ".");
  }

  function displayTodayDate(date) {
    const match = date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) return date;
    return `${match[1]}.${match[2]}.${match[3]}`;
  }

  function readEntries() {
    try {
      const saved = localStorage.getItem("diaryEntries");
      if (saved !== null) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {
      console.warn("日記データを読み込めませんでした。", e);
    }
    return [];
  }

  function dailyEntry(entries, today) {
    const eligible = entries.filter(e =>
      e &&
      typeof e.date === "string" &&
      e.date < today &&
      (
        (typeof e.body === "string" && e.body.trim().length > 0) ||
        e.hasFeeling === true ||
        e.feelingRecorded === true ||
        Boolean(e.emotion)
      )
    );

    if (!eligible.length) return null;

    try {
      const savedDate = localStorage.getItem("diaryReflectionDate");
      const savedId = localStorage.getItem("diaryReflectionEntryId");
      const existing = eligible.find(e => String(e.id) === savedId);
      if (savedDate === today && existing) return existing;

      let recent = JSON.parse(
        localStorage.getItem("diaryRecentReflectionIds") || "[]"
      );
      if (!Array.isArray(recent)) recent = [];

      let candidates = eligible.filter(e => !recent.includes(String(e.id)));
      if (!candidates.length) candidates = eligible;

      // 元の仕様を維持し、同じ日には同じ振り返り日記を表示する
      const seed = Number(today.replaceAll("-", ""));
      const selected = candidates[seed % candidates.length];

      localStorage.setItem("diaryReflectionDate", today);
      localStorage.setItem("diaryReflectionEntryId", String(selected.id));

      recent = [
        String(selected.id),
        ...recent.filter(id => id !== String(selected.id))
      ].slice(0, 5);

      localStorage.setItem("diaryRecentReflectionIds", JSON.stringify(recent));
      return selected;
    } catch (e) {
      return eligible[0];
    }
  }

  function setText(groupId, value) {
    const group = svg.querySelector("#" + CSS.escape(groupId));
    const text = group?.querySelector("text");
    if (!text) return;
    const tspan = text.querySelector("tspan");
    if (tspan) tspan.textContent = value;
    else text.textContent = value;
  }

  function addImage(groupId, src, label) {
    const group = svg.querySelector("#" + CSS.escape(groupId));
    const rect = group?.querySelector("rect");
    if (!group || !rect || group.querySelector(".dynamic-mark")) return;

    const image = document.createElementNS(NS, "image");
    image.classList.add("dynamic-mark");
    image.setAttribute("x", rect.getAttribute("x"));
    image.setAttribute("y", rect.getAttribute("y"));
    image.setAttribute("width", rect.getAttribute("width"));
    image.setAttribute("height", rect.getAttribute("height"));
    image.setAttribute("preserveAspectRatio", "xMidYMid meet");
    image.setAttribute("href", src);
    image.setAttribute("aria-label", label);
    image.setAttribute("pointer-events", "none");
    group.appendChild(image);
  }

  function setExcerpt(entry) {
    const group = svg.querySelector("#_テキストボックス");
    if (!group) return;

    group.querySelector(".diary-excerpt")?.remove();

    // 新しいhome-main.svgのテキスト枠座標に合わせている
    if (!entry) {
      const prompt = document.createElementNS(NS, "text");
      prompt.classList.add("diary-excerpt");
      prompt.setAttribute("x", "261");
      prompt.setAttribute("y", "596");
      prompt.setAttribute("fill", "#8b6f55");
      prompt.setAttribute("font-family", "'Zen Maru Gothic', sans-serif");
      prompt.setAttribute("font-size", "20");
      prompt.setAttribute("pointer-events", "none");
      prompt.textContent = "日記をつけてみましょう";
      group.insertBefore(prompt, group.querySelector("rect") || null);
      return;
    }

    if (typeof entry.body !== "string" || !entry.body.trim()) return;

    const text = document.createElementNS(NS, "text");
    text.classList.add("diary-excerpt");
    text.setAttribute("x", "261");
    text.setAttribute("y", "572");
    text.setAttribute("fill", "#8b6f55");
    text.setAttribute("font-family", "'Zen Maru Gothic', sans-serif");
    text.setAttribute("font-weight", "400");
    text.setAttribute("font-size", "20");
    text.setAttribute("pointer-events", "none");

    const chars = Array.from(entry.body.trim());
    const excerpt = chars.length > 22
      ? chars.slice(0, 21).join("") + "…"
      : chars.join("");

    const line1 = document.createElementNS(NS, "tspan");
    line1.setAttribute("x", "261");
    line1.textContent = Array.from(excerpt).slice(0, 11).join("");
    text.appendChild(line1);

    const secondText = Array.from(excerpt).slice(11).join("");
    if (secondText) {
      const line2 = document.createElementNS(NS, "tspan");
      line2.setAttribute("x", "261");
      line2.setAttribute("dy", "30");
      line2.textContent = secondText;
      text.appendChild(line2);
    }

    const border = group.querySelector("rect");
    group.insertBefore(text, border || null);
  }

  function addHitArea(rootSvg, groupId, label, action) {
    const group = rootSvg.querySelector("#" + CSS.escape(groupId));
    if (!group || group.querySelector(".hit-area")) return;

    let bounds;
    try {
      bounds = group.getBBox();
    } catch (e) {
      return;
    }
    if (!bounds.width || !bounds.height) return;

    const hit = document.createElementNS(NS, "rect");
    hit.classList.add("hit-area");
    hit.setAttribute("x", bounds.x - 8);
    hit.setAttribute("y", bounds.y - 8);
    hit.setAttribute("width", bounds.width + 16);
    hit.setAttribute("height", bounds.height + 16);
    hit.setAttribute("fill", "transparent");
    hit.setAttribute("pointer-events", "all");
    hit.setAttribute("role", "button");
    hit.setAttribute("tabindex", "0");
    hit.setAttribute("aria-label", label);
    hit.style.cursor = "pointer";
    hit.addEventListener("click", action);
    hit.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        action();
      }
    });
    group.appendChild(hit);
  }

  function navigate(page, params = {}) {
    const url = new URL(PAGES[page], location.href);
    Object.entries(params).forEach(([key, value]) => {
      url.searchParams.set(key, value);
    });
    location.href = url.href;
  }

  function initializeHome() {
    const today = localDateString();
    const entries = readEntries();
    const entry = dailyEntry(entries, today);

    setText("_今日の日付", displayTodayDate(today));

    if (entry) {
      setText("_振り返り日付", displayDate(entry.date));
      setExcerpt(entry);

      if (entry.emotion) {
        addImage("_マーク位置_振り返り_", `marks/${entry.emotion}.png`, entry.emotion);
      }

      const hasBody = typeof entry.body === "string" && Boolean(entry.body.trim());
      const hasFeeling =
        entry.hasFeeling === true ||
        entry.feelingRecorded === true ||
        Boolean(entry.emotion);

      const feeling = svg.querySelector("#_感情バーを見るボタン");
      const read = svg.querySelector("#_続きを読む");

      if (feeling) feeling.style.display = !hasBody && hasFeeling ? "" : "none";
      if (read) read.style.display = hasBody ? "" : "none";

      if (hasBody) {
        addHitArea(svg, "_続きを読む", "続きを読む", () =>
          navigate("record", { date: entry.date, mode: "read" })
        );
      } else if (hasFeeling) {
        addHitArea(svg, "_感情バーを見るボタン", "感情バーを見る", () =>
          navigate("record", { date: entry.date, mode: "feeling" })
        );
      }
    } else {
      svg.querySelector("#_振り返り日付")?.style.setProperty("display", "none");
      svg.querySelector("#_マーク位置_振り返り_")?.style.setProperty("display", "none");
      setExcerpt(null);
      svg.querySelector("#_感情バーを見るボタン")?.style.setProperty("display", "none");
      svg.querySelector("#_続きを読む")?.style.setProperty("display", "none");
    }

    addImage("_マーク位置_画面上部_", "marks/固定マーク.png", "固定マーク");

    // フッターの各アイコン
    addHitArea(footerSvg, "_ホーム", "ホーム", () => navigate("home"));
    addHitArea(footerSvg, "_カレンダー", "カレンダー", () => navigate("calendar"));
    addHitArea(footerSvg, "_検索", "検索", () => navigate("search"));
    addHitArea(footerSvg, "_マイページ", "マイページ", () => navigate("mypage"));

    // ヘッダーのメニュー
    addHitArea(headerSvg, "_メニュー", "メニュー", () => navigate("menu"));

    // メイン内の記録ボタン
    addHitArea(svg, "_記録ボタン", "日記を書く", () =>
      navigate("record", { date: today, mode: "new" })
    );
  }

  async function start() {
    try {
      headerSvg = await loadSvg(ASSET + "header.svg", "header-slot");
      svg = await loadSvg(ASSET + "home-main.svg", "main-slot");
      footerSvg = await loadSvg(ASSET + "footer.svg", "footer-slot");
      svg.setAttribute("id", "art");
      initializeHome();
    } catch (error) {
      console.error(error);
      document.getElementById("main-area").innerHTML =
        '<p style="color:#8b6f55;padding:1em;text-align:center;">画面を読み込めませんでした。index.htmlとassetsフォルダを同じ場所に置き、ローカルサーバーまたはGitHub Pagesで開いてください。</p>';
    }
  }

  start();
})();
</script>
</body>
</html>
